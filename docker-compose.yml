services:
  emdash:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${EMDASH_PORT:-4321}:4321"
    volumes:
      # Persistent data: SQLite database and uploaded media
      - emdash-data:/app/data
      - emdash-uploads:/app/uploads
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      # ORIGIN must match how you access the site in browser
      # Required for passkey/WebAuthn registration to work
      # Examples: http://localhost:4321, https://cms.example.com
      - ORIGIN=${ORIGIN:-https://wp.sylee.dev}
    restart: unless-stopped

volumes:
  emdash-data:
  emdash-uploads:
